
# -------------------------------------------------
# 资产基本配置
# -------------------------------------------------

assets:
  bbq_sauce: &bbq_sauce
    scale: [1.0, 1.0, 1.0]
    physics: "RIGIDBODY"
    usd: "scene/example_assets/bbq_sauce/usd/bbq_sauce.usd"
    urdf: "scene/example_assets/bbq_sauce/urdf/bbq_sauce.urdf"
    mjcf: "scene/example_assets/bbq_sauce/mjcf/bbq_sauce.xml"

# -------------------------------------------------
# 仿真和机器人基本配置
# -------------------------------------------------

# -------------------------------------------------
# 场景配置
# -------------------------------------------------
scenario:

  robots: franka
  sim: isaaclab
  num_envs: 1
  headless: false
  try_add_table: false
  task: "pick up the middle bbq sauce bottle"
  cameras:
    - name: cam1
      width: 1024
      height: 1024
      pos: [1.5, -1.5, 1.5]
      look_at: [0.0, 0.0, 0.0]
    - name: cam2
      width: 1024
      height: 1024
      pos: [0.3, 0.0, 2.5]
      look_at: [0.3, 0.0, 0.0]

  # 物体配置
  objects:
    - name: bbq_sauce_1_1
      <<: *bbq_sauce
    - name: bbq_sauce_1_2
      <<: *bbq_sauce
    - name: bbq_sauce_1_3
      <<: *bbq_sauce

# -------------------------------------------------
# 初始状态配置 (只配置一个环境)
# -------------------------------------------------
initial_state:
  objects:
    bbq_sauce_1_1:
      pos: [0.4, -0.3, 0.13]
      rot: [1.0, 0.0, 0.0, 0.0]
    bbq_sauce_1_2:
      pos: [0.4, 0.0, 0.13]
      rot: [1.0, 0.0, 0.0, 0.0]
    bbq_sauce_1_3:
      pos: [0.4, 0.3, 0.13]
      rot: [1.0, 0.0, 0.0, 0.0]
  robots:
    franka:
      pos: [0.0, 0.0, 0.0]
      rot: [1.0, 0.0, 0.0, 0.0]
      dof_pos:
        panda_joint1: 0.0
        panda_joint2: -0.785398
        panda_joint3: 0.0
        panda_joint4: -2.356194
        panda_joint5: 0.0
        panda_joint6: 1.570796
        panda_joint7: 0.785398
        panda_finger_joint1: 0.04
        panda_finger_joint2: 0.04
